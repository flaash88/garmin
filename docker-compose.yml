# =============================================================================
# Takt — Verbund für den Betrieb.
#
#   datenbank     PostgreSQL
#   wanderung     spielt die Wanderungen ein und endet — läuft vor allem anderen
#   takt          Webdienst
#   zeitplan      stündlicher Abgleich, tägliche Prüfung des Wochenbriefings
#   sicherung     pg_dump täglich, sieben Stände
#
#   docker compose up -d --build
#
# **--build gehört dazu.** Ohne das nimmt Compose ein einmal gebautes Abbild
# weiter, auch wenn Quelltext oder diese Datei sich geändert haben. Genau so
# ist der Dienst wanderung einmal abgebrochen: sein Startbefehl wurde auf
# datenbank/hochfahren.sh umgestellt, das Abbild stammte aber noch von davor
# und kannte die Datei nicht. Siehe DECISIONS.md, E13.1.
#
# Alle Werte kommen aus .env. Siehe .env.beispiel.
# =============================================================================

name: takt

services:
  datenbank:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-takt}
      # C.UTF-8, nicht de_DE.UTF-8.
      #
      # Das Alpine-Abbild baut auf musl und bringt keine Gebietsdaten mit;
      # initdb bricht mit de_DE.UTF-8 ab oder fällt stillschweigend auf
      # Byte-Reihenfolge zurück — die deutsche Sortierung wäre dann nur
      # behauptet. C.UTF-8 gibt es überall und sortiert nach Byte-Reihenfolge.
      #
      # Wird deutsche Sortierung später wirklich gebraucht, geht das ohne
      # neues initdb je Spalte:
      #   CREATE COLLATION deutsch (provider = icu, locale = 'de-AT');
      #   ALTER TABLE … ALTER COLUMN name TYPE text COLLATE deutsch;
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-takt} -d ${POSTGRES_DB:-takt}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Kein Port nach außen. Erreichbar nur im Verbund.
    expose:
      - '5432'

  # Einmaliger Lauf vor allem anderen. Spielt die Wanderungen ein, legt das
  # Auswertungsschema und die Rolle takt_coach an und prüft, dass die
  # Verbindung mit dieser Rolle steht. Danach endet er.
  #
  # Ein eigener Dienst statt eines Schritts im Webdienst, weil das genau
  # einmal laufen soll — nicht in jedem Prozess, der hochfährt.
  wanderung:
    build:
      context: .
      target: werkzeuge
    depends_on:
      datenbank:
        condition: service_healthy
    environment:
      TAKT_DATENBANK_URL: postgres://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD}@datenbank:5432/${POSTGRES_DB:-takt}
      TAKT_COACH_PASSWORT: ${TAKT_COACH_PASSWORT:-}
      TZ: ${TZ:-Europe/Vienna}
    # Der Startbefehl prüft zuerst, ob es im Abbild gibt, was der Schritt
    # anfasst — nicht nur das Skript selbst, sondern auch, was es liest.
    #
    # Die Prüfung steht hier und nicht im Abbild, und das ist der Punkt: diese
    # Datei ist beim Start immer die neueste, das Abbild kann alt sein. Fehlt
    # etwas, ist «sh: can't open …» die Auskunft, die man nicht gebrauchen
    # kann — hier steht stattdessen, woran es liegt und was zu tun ist.
    command:
      - sh
      - -c
      - |
        fehlt=""
        for datei in datenbank/hochfahren.sh datenbank/01-auswertung-schema.sql \
                     node_modules/.bin/drizzle-kit drizzle; do
          [ -e "$$datei" ] || fehlt="$$fehlt $$datei"
        done
        if [ -n "$$fehlt" ]; then
          echo "FEHLER: Im Abbild fehlt, was der Hochlauf braucht:$$fehlt" >&2
          echo "  Das Abbild ist älter als diese docker-compose.yml." >&2
          echo "  Neu bauen:  docker compose up -d --build" >&2
          exit 1
        fi
        exec sh datenbank/hochfahren.sh
    restart: 'no'

  takt:
    build:
      context: .
      target: laufen
    restart: unless-stopped
    depends_on:
      datenbank:
        condition: service_healthy
      wanderung:
        condition: service_completed_successfully
    environment:
      TAKT_DATENBANK_URL: postgres://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD}@datenbank:5432/${POSTGRES_DB:-takt}
      # Nur setzen, wenn ein Passwort hinterlegt ist. Sonst stünde hier eine
      # Zeichenkette mit leerem Passwort, der Wächter in sql-ausfuehren.ts
      # griffe nie, und statt «Der Coach braucht eine eigene Rolle» käme ein
      # nackter Anmeldefehler aus der Datenbank.
      TAKT_SQL_ROLLE_URL: ${TAKT_COACH_PASSWORT:+postgres://takt_coach:${TAKT_COACH_PASSWORT}@datenbank:5432/${POSTGRES_DB:-takt}}
      TAKT_PASSWORT_HASH: ${TAKT_PASSWORT_HASH:?TAKT_PASSWORT_HASH fehlt}
      TAKT_SITZUNG_SECRET: ${TAKT_SITZUNG_SECRET:?TAKT_SITZUNG_SECRET fehlt}
      TAKT_WEBHOOK_SECRET: ${TAKT_WEBHOOK_SECRET:-}
      TAKT_IP_KOPF: ${TAKT_IP_KOPF:-cf-connecting-ip}
      ICU_API_KEY: ${ICU_API_KEY:-}
      ICU_ATHLET_ID: ${ICU_ATHLET_ID:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TAKT_CLAUDE_BINAERDATEI: ${TAKT_CLAUDE_BINAERDATEI:-}
      TZ: ${TZ:-Europe/Vienna}
    # Nur auf dem Wirt erreichbar, nicht im Netz. Davor gehört etwas, das
    # HTTPS liefert — cloudflared auf dem Wirt, ein Reverse Proxy, was auch
    # immer. Takt setzt das Sitzungscookie mit `Secure`; über Klartext-HTTP
    # verwirft der Browser es und die Anmeldung läuft im Kreis.
    ports:
      - '127.0.0.1:3000:3000'

  zeitplan:
    build:
      context: .
      target: werkzeuge
    restart: unless-stopped
    depends_on:
      datenbank:
        condition: service_healthy
      wanderung:
        condition: service_completed_successfully
    environment:
      TAKT_DATENBANK_URL: postgres://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD}@datenbank:5432/${POSTGRES_DB:-takt}
      TAKT_SQL_ROLLE_URL: ${TAKT_COACH_PASSWORT:+postgres://takt_coach:${TAKT_COACH_PASSWORT}@datenbank:5432/${POSTGRES_DB:-takt}}
      ICU_API_KEY: ${ICU_API_KEY:-}
      ICU_ATHLET_ID: ${ICU_ATHLET_ID:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TAKT_CLAUDE_BINAERDATEI: ${TAKT_CLAUDE_BINAERDATEI:-}
      TZ: ${TZ:-Europe/Vienna}

  sicherung:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      datenbank:
        condition: service_healthy
    environment:
      PGHOST: datenbank
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-takt}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-takt}
      SICHERUNG_VERZEICHNIS: /sicherung
      SICHERUNG_STAENDE: ${SICHERUNG_STAENDE:-7}
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - sicherung:/sicherung
      - ./datenbank/sicherung.sh:/sicherung.sh:ro
    entrypoint: ['/bin/sh', '/sicherung.sh']

volumes:
  datenbank:
  sicherung:
